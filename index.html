<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestor Financeiro PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-color: #2c3e50; --bg-body: #ecf0f1; --bg-element: #ffffff; --text-color: #333333; --border-color: #dddddd; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .login-box { background: var(--bg-element); padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid var(--primary-color);}
        .login-box h1 { color: var(--primary-color); margin-bottom: 10px; font-size: 1.8rem; }
        .login-box p { color: #7f8c8d; margin-bottom: 30px; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-bottom: 10px;}
        .btn-login { background-color: var(--primary-color); color: white; }
        .btn-login:hover { background-color: #1a252f; }
        .btn-register { background-color: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .btn-register:hover { background-color: #f1f2f6; }
        
        .link-esqueci { color: var(--primary-color); font-size: 0.85rem; cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }
        .link-esqueci:hover { color: #1a252f; }

        /* Área oculta que só aparece quando o usuário clica no link do e-mail */
        #area-nova-senha { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: left; }
        
        #mensagem { margin-top: 15px; font-size: 0.9rem; font-weight: bold; min-height: 20px; }
        .erro { color: #e74c3c; }
        .sucesso { color: #2ecc71; }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Gestor Financeiro</h1>
    <p>Acesse sua conta ou cadastre-se</p>

    <div id="area-login-padrao">
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="******" required>
        </div>

        <button class="btn btn-login" onclick="fazerLogin()">Entrar</button>
        <button class="btn btn-register" onclick="criarConta()">Criar Nova Conta</button>
        <span class="link-esqueci" onclick="recuperarSenha()">Esqueci minha senha</span>
    </div>

    <div id="area-nova-senha">
        <div class="form-group">
            <label>Digite sua Nova Senha</label>
            <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres" required>
        </div>
        <button class="btn btn-login" onclick="salvarNovaSenha()">Atualizar Senha</button>
    </div>

    <div id="mensagem"></div>
</div>

<script>
    // ==========================================
    // COLE SUAS CHAVES DO SUPABASE AQUI EMBAIXO:
    // ==========================================
    const supabaseUrl = 'https://wmfgttnljcljhresviuw.supabase.co'; 
    const supabaseKey = 'sb_publishable_jzIwu_Z27ir5YBWrPGO4iw_In0DSd1G'; 
    
    const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    const msgEl = document.getElementById('mensagem');

    function mostrarMensagem(texto, tipo) {
        msgEl.textContent = texto;
        msgEl.className = tipo;
    }

    // --- FUNÇÕES DE LOGIN E CADASTRO ---
    async function criarConta() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('senha').value;
        if(!email || password.length < 6) { mostrarMensagem("E-mail inválido ou senha curta (min 6).", "erro"); return; }
        mostrarMensagem("Criando conta...", "sucesso");
        const { error } = await clienteSupabase.auth.signUp({ email, password });
        if (error) mostrarMensagem(error.message, "erro");
        else { mostrarMensagem("Conta criada! Entrando...", "sucesso"); setTimeout(() => { window.location.href = 'app.html'; }, 1500); }
    }

    async function fazerLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('senha').value;
        if(!email || !password) { mostrarMensagem("Preencha e-mail e senha.", "erro"); return; }
        mostrarMensagem("Autenticando...", "sucesso");
        const { error } = await clienteSupabase.auth.signInWithPassword({ email, password });
        if (error) mostrarMensagem("E-mail ou senha incorretos.", "erro");
        else { mostrarMensagem("Login efetuado!", "sucesso"); setTimeout(() => { window.location.href = 'app.html'; }, 1000); }
    }

    // --- NOVA FUNÇÃO: PEDIR RECUPERAÇÃO DE SENHA ---
    async function recuperarSenha() {
        const email = document.getElementById('email').value;
        if(!email) {
            mostrarMensagem("Digite seu e-mail no campo acima primeiro!", "erro");
            return;
        }
        mostrarMensagem("Enviando e-mail de recuperação...", "sucesso");
        
        // Pede para o Supabase enviar o e-mail e voltar para a página atual
        const { error } = await clienteSupabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.href
        });

        if (error) mostrarMensagem("Erro: " + error.message, "erro");
        else mostrarMensagem("E-mail enviado! Verifique sua caixa de entrada e Spam.", "sucesso");
    }

    // --- NOVA FUNÇÃO: DETECTAR VOLTA DO E-MAIL ---
    // Essa função fica "escutando". Se a pessoa abrir o site pelo link do e-mail, ela é ativada.
    clienteSupabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
            document.getElementById('area-login-padrao').style.display = 'none'; // Esconde o login normal
            document.getElementById('area-nova-senha').style.display = 'block';  // Mostra campo de nova senha
            mostrarMensagem("Modo de recuperação ativado! Crie sua nova senha.", "sucesso");
        } else if (event === 'SIGNED_IN' && !document.getElementById('area-nova-senha').style.display === 'block') {
            // Se fez login normal e não está recuperando senha, vai pro app
            window.location.href = 'app.html';
        }
    });

    // --- NOVA FUNÇÃO: SALVAR A SENHA NOVA ---
    async function salvarNovaSenha() {
        const novaSenha = document.getElementById('nova-senha').value;
        if(novaSenha.length < 6) { mostrarMensagem("A senha deve ter pelo menos 6 caracteres.", "erro"); return; }
        
        mostrarMensagem("Atualizando senha...", "sucesso");
        const { error } = await clienteSupabase.auth.updateUser({ password: novaSenha });
        
        if (error) mostrarMensagem("Erro ao atualizar: " + error.message, "erro");
        else {
            mostrarMensagem("Senha atualizada com sucesso! Entrando...", "sucesso");
            setTimeout(() => { window.location.href = 'app.html'; }, 1500);
        }
    }

</script>
</body>
</html>
